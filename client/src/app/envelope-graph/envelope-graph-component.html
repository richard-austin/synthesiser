<div class="display" >
  @if (showGraph()) {
    <div #configEditor
         style="background-color: black"
         [animate.enter]="'fade-in'"
         [animate.leave]="'fade-out'">
      <canvas #canvas [width]="canvasWidth" [height]="canvasHeight"></canvas>
      <div class="graph-content">
        Graph Metadata & Interactive UI
      </div>
    </div>
  }
</div>
