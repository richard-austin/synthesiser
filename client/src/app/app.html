<div class="options">
  <div class="splash">
    <h3>FM Synthesiser version 1.0.0</h3>
    <img alt="synth image" priority ngSrc="/synthSplash.png" height="239" width="422">
    <button (click)="showHomeForm()">Start</button>
  </div>
  @if (started) {
    <div class="synth-background">
      <app-synth-component></app-synth-component>
    </div>
  }
  <app-config-file style="position: absolute; z-index: 10"></app-config-file>
</div>
