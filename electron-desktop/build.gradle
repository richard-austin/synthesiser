import com.github.gradle.node.npm.task.NpmTask

plugins {
    id "com.github.node-gradle.node" version "7.1.0"
}

node {
    version = '24.21.0'
    download = true
}

// Fixed: Changed from Exec to NpmTask
//noinspection GroovyAssignabilityCheck
tasks.register('setVersion', NpmTask) {
    group = 'build'

    // NpmTask natively knows to run npm. You only supply the arguments.
    args = ["version", providers.gradleProperty('synthesiserVersion').get(), "-allow-same-version"]
}

// Fixed: Changed from Exec to NpmTask
//noinspection GroovyAssignabilityCheck
tasks.register('buildLinux', NpmTask) {
    group = 'build'
    // 'npmInstall' is a task provided by the plugin, but we target its safe reference
    dependsOn ":server:bootJar", ":electron-desktop:setVersion", "npmInstall"

    args = ["run", "build:linux"]
}

// This can remain an Exec task because it runs a compiled Linux AppImage, not Node/NPM code
tasks.register("runAppImage", Exec) {
    group = 'application'
    workingDir "$projectDir/dist"
    executable "./synthesiser-desktop-${providers.gradleProperty('synthesiserVersion').get()}.AppImage"
}
