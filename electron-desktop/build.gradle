tasks.register('buildLinux', Exec) {
    group='build'
    dependsOn ":server:bootJar"

    workingDir "$projectDir"

    executable "npm"
    args = ["run", "build:linux"]
}
tasks.register("runAppImage", Exec) {
    group='application'

    workingDir "$projectDir/dist"

    executable "./synthesiser-desktop-1.0.0.AppImage"
}
