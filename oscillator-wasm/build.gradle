repositories {
    mavenCentral()
    maven {
        url = 'https://gradle.org'
    }
}

// 1. Safe configuration-time retrieval of the tool extension
def emscriptenTool = rootProject.extensions.findByName('komple')?.tools?.emscripten
if (emscriptenTool == null) {
    throw new GradleException("The 'komple' extension or 'emscripten' toolchain is missing from your root build.gradle.")
}

// 2. Reflectively capture the environment map fields
Map<String, String> finalEnvMap = [:]
def envProperty = emscriptenTool.properties['env'] ?: emscriptenTool.properties['environment']
if (envProperty instanceof Provider) {
    finalEnvMap = envProperty.get() as Map<String, String>
} else if (envProperty instanceof Map) {
    finalEnvMap = (Map<String, String>) envProperty
} else {
    finalEnvMap = emscriptenTool.getProperties().getOrDefault('env', [:]) as Map
}

// 3. Directly target the confirmed emcc executable relative to the root layout context
File emccExecutable = rootProject.layout.projectDirectory.file(".komple/installs/emscripten/upstream/emscripten/emcc").asFile
String absoluteEmccPath = emccExecutable.absolutePath

// 4. Pre-compute primitive file layouts to satisfy the Configuration Cache completely
File processorSourceFile = layout.projectDirectory.file('processor.c').asFile
File portamentoSourceFile = layout.projectDirectory.file('portamento.c').asFile
File envelopeSourceFile = layout.projectDirectory.file('envelope.c').asFile
File pitchEnvelopeSourceFile = layout.projectDirectory.file('pitch_envelope.c').asFile
File lfoSourceFile = layout.projectDirectory.file('lfo.c').asFile
File filterSourceFile = layout.projectDirectory.file('filter.c').asFile
File butterworthSourceFile = layout.projectDirectory.file('butterworth_filter.c').asFile
File setupFromControlsSourceFile = layout.projectDirectory.file('setup_from_controls.c').asFile
File keyToFrequencySourceFile = layout.projectDirectory.file('key_to_frequency.c').asFile
File globalsSourceFile = layout.projectDirectory.file('globals.c').asFile

File outputDirectory = new File(rootDir, '/client/public/assets/wasm') //layout.buildDirectory.dir('wasm').get().asFile
String outputJsPath = new File(outputDirectory, 'engine-module.js').absolutePath

// 1. The Diagnostic Version Check Task
tasks.register('checkWasmVersion', Exec) {
    def kompleExtension = rootProject.extensions.findByName('komple')
    def emccPath = kompleExtension?.tools?.emscripten

    doFirst {
        println "========================================="
        println "   EMSCRIPTEN COMPILER DIAGNOSTICS"
        println "========================================="
        println "Gradle toolchain path: ${emccPath}"
        println "========================================="
    }

    println(commandLine(
            absoluteEmccPath,
            "--version"
    ).toString())

//    if (emccPath) {
//        commandLine emccPath.toString(), "--version"
//    } else {
//        // Fallback placeholder to prevent task initialization errors if config is missing
//        commandLine "echo", "ERROR: Could not find the 'komple' Emscripten tool configuration!"
//    }
}

tasks.register('clean', Delete) {
    group = 'build'
    delete "${outputJsPath}"
}

// 5. Register the final cache-compliant automated execution task
tasks.register('compileWasm', Exec) {
    dependsOn('clean')
    group = 'build'
    description = 'Compiles processor.c into WebAssembly using Emscripten.'

    // Ensure the task automatically triggers if your C source modifications change
    inputs.file(processorSourceFile)
    inputs.file(portamentoSourceFile)
    inputs.file(envelopeSourceFile)
    inputs.file(pitchEnvelopeSourceFile)
    inputs.file(lfoSourceFile)
    inputs.file(filterSourceFile)
    inputs.file(butterworthSourceFile)
    inputs.file(setupFromControlsSourceFile)
    inputs.file(keyToFrequencySourceFile)
    inputs.file(globalsSourceFile)
    outputs.dir(outputDirectory)

    // Ensure the plugin installation executes before this compilation runs
    dependsOn rootProject.tasks.named('emscriptenInstall')

    // Inject the toolchain environment
    environment finalEnvMap

    doFirst {
        // Ensure the output directory exists before compiling
        if (!outputDirectory.exists()) {
            outputDirectory.mkdirs()
        }
    }

   // emcc processor.c -O3 -flto -msimd128 -ffast-math -o processor.js -s WASM=1 -s AUDIO_WORKLET=1 -s WASM_WORKERS=1 -s STANDALONE_WASM -s EXPORTED_FUNCTIONS=['_initProcessor','_setMatrixGain','_setBankEnvelopeParams','_triggerNoteOn','_triggerNoteOff','_getBankOutputBufferPtr','_processBlock'] --no-entry
    // Call the verified absolute path direct from the .komple tracking home
    commandLine(
            absoluteEmccPath,
            processorSourceFile.absolutePath,
            portamentoSourceFile.absolutePath,
            envelopeSourceFile.absolutePath,
            pitchEnvelopeSourceFile.absolutePath,
            filterSourceFile.absolutePath,
            lfoSourceFile.absolutePath,
            butterworthSourceFile.absolutePath,
            setupFromControlsSourceFile.absolutePath,
            keyToFrequencySourceFile.absolutePath,
            globalsSourceFile.absolutePath,
            "-O3",
            "-flto",
            "-msimd128",
            "-ffast-math",
            "-o", "${outputJsPath}",
            "-s", "WASM=1",
            "-s", "ENVIRONMENT=worklet",
            "-s", "SINGLE_FILE=1",
            "-s", "ALLOW_MEMORY_GROWTH=1",
            "-s", "EXPORTED_RUNTIME_METHODS=['HEAP32','HEAPF32']",
            // MANDATORY: Forces Emscripten to check and execute our custom callback hook
            "-s", "INCOMING_MODULE_JS_API=['onRuntimeInitialized']",
            "--post-js", "${rootDir}/client/public/assets/wasm/audio-hooks.js",
            "-s", 'EXPORTED_FUNCTIONS=["_malloc","_free"]',
            "--no-entry"
    )
}
