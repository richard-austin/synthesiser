import org.gradle.nativeplatform.platform.internal.DefaultNativePlatform

repositories {
    mavenCentral()
    maven {
        url = 'https://gradle.org'
    }
}

// 1. Safe configuration-time retrieval of the tool extension
def emscriptenTool = rootProject.extensions.findByName('komple')?.tools?.emscripten
if (emscriptenTool == null) {
    throw new GradleException("The 'komple' extension or 'emscripten' toolchain is missing from your root build.gradle.")
}

// 2. Reflectively capture the environment map fields
Map<String, String> finalEnvMap = [:]
def envProperty = emscriptenTool.properties['env'] ?: emscriptenTool.properties['environment']
if (envProperty instanceof Provider) {
    finalEnvMap = envProperty.get() as Map<String, String>
} else if (envProperty instanceof Map) {
    finalEnvMap = (Map<String, String>) envProperty
} else {
    finalEnvMap = emscriptenTool.getProperties().getOrDefault('env', [:]) as Map
}

def emcc = "emcc"

OperatingSystem os = DefaultNativePlatform.currentOperatingSystem
if (os.toFamilyName() == 'windows')
    emcc = "emcc.bat"

// 3. Directly target the confirmed emcc executable relative to the root layout context
File emccExecutable = rootProject.layout.projectDirectory.file(".komple/installs/emscripten/upstream/emscripten/$emcc").asFile
String absoluteEmccPath = emccExecutable.absolutePath

File outputDirectory = new File(rootDir, '/client/public/assets/wasm') //layout.buildDirectory.dir('wasm').get().asFile
String outputJsPath = new File(outputDirectory, 'engine-module.js').absolutePath

// 1. The Diagnostic Version Check Task
tasks.register('checkWasmVersion', Exec) {
    def kompleExtension = rootProject.extensions.findByName('komple')
    def emccPath = kompleExtension?.tools?.emscripten

    doFirst {
        println "========================================="
        println "   EMSCRIPTEN COMPILER DIAGNOSTICS"
        println "========================================="
        println "Gradle toolchain path: ${emccPath}"
        println "========================================="
    }

    println(commandLine(
            absoluteEmccPath,
            "--version"
    ).toString())
}

tasks.register('clean', Delete) {
    group = 'build'
    delete "${outputJsPath}"
}

// 5. Register the final cache-compliant automated execution task
tasks.register('compileWasm', Exec) {
    group = 'build'
    description = 'Compiles processor.c into WebAssembly using Emscripten.'

    // Ensure the task automatically triggers if your C source modifications change
    inputs.files fileTree(dir: layout.projectDirectory, include: '*.c')

    outputs.dir(outputDirectory)

    // Ensure the plugin installation executes before this compilation runs
    dependsOn rootProject.tasks.named('emscriptenInstall')

    // Inject the toolchain environment
    environment finalEnvMap

    doFirst {
        // Ensure the output directory exists before compiling
        if (!outputDirectory.exists()) {
            outputDirectory.mkdirs()
        }
    }

    // 2. Define your compiler flags and options
    def emccArgs = [
            "-O3",
            "-flto",
            "-msimd128",
            "-ffast-math",
            "-o", "${outputJsPath}",
            "-s", "WASM=1",
            "-s", "ENVIRONMENT=worklet",
            "-s", "SINGLE_FILE=1",
            "-s", "ALLOW_MEMORY_GROWTH=1",
            "-s", "EXPORTED_RUNTIME_METHODS=['HEAP32','HEAPF32']",
            // MANDATORY: Forces Emscripten to check and execute custom callback hook
            "-s", "INCOMING_MODULE_JS_API=['onRuntimeInitialized']",
            "--post-js", "${rootDir}/client/public/assets/wasm/audio-hooks.js",
            "-s", 'EXPORTED_FUNCTIONS=["_malloc","_free"]',
            "--no-entry"
    ]

    // 3. Combine everything dynamically into the command line
    // Construct the list smoothly without '+' or 'addAll' methods
    def cmd = []
    cmd << absoluteEmccPath
    cmd.addAll(inputs.files.files*.absolutePath as Object[]) // Cast to bypass JetBrains type inspection
    cmd.addAll(emccArgs)

    commandLine = cmd
}
