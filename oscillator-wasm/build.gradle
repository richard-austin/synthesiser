import io.github.richard_austin.tasks.TinyGoTask
plugins {
    id "io.github.richard-austin.tinygo-plugin" version "0.0.1"
}
repositories {
    mavenCentral()
    mavenLocal()
    maven {
        url = 'https://gradle.org'
    }
}

tinygo {
    tinyGoVersion = "0.41.1"
}

tasks.register('tinygo', TinyGoTask) {
    group='build'
    workingDir="$projectDir"

    tinyGoTaskEnv= [GOOS:'linux', GOARCH:'amd64']

    tinyGoTaskArgs= ['build', '-o', '../client/public/assets/wasm/processor.wasm', '-target', 'wasm', '-no-debug', './processor.go']
}
