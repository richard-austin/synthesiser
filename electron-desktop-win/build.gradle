import com.github.gradle.node.npm.task.NpmTask

plugins {
    id "com.github.node-gradle.node" version "7.1.0"
}

node {
    version = '24.21.0'
    download = true
}

//noinspection GroovyAssignabilityCheck
tasks.register('setVersion', NpmTask) {
    group='build'
    args = ["version", providers.gradleProperty('synthesiserVersion').get(), "-allow-same-version"]
}
//noinspection GroovyAssignabilityCheck
tasks.register('buildWindows', NpmTask) {
    group='build'
    dependsOn ":server:bootJar", ":electron-desktop-win:setVersion"

 //   workingDir = projectDir

    args = ["run", "build:win"]
}
