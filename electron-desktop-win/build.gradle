tasks.register('setVersion', Exec) {
    group='build'
    executable "npm"
    args = ["version", providers.gradleProperty('synthesiserVersion').get(), "-allow-same-version"]
}

tasks.register('buildWindows', Exec) {
    group='build'
    dependsOn ":server:bootJar", ":electron-desktop-win:setVersion"

    workingDir "$projectDir"

    executable "npm"
    args = ["run", "build:win"]
}
